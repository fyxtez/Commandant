[package]
name = "commandant"
version = "0.1.0"
description = "Remote systemd control over SSH"
edition = "2021"

[lib]
name = "commandant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.45"
russh-keys = "0.45"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
async-trait = "0.1"
